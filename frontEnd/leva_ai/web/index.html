<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Plataforma para intermediação e contratação de fretes e mudanças. Conecta motoristas e usuários através de busca inteligente por capacidade de carga, tipo de veículo e localização. (Projeto de TCC)">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="LevaAí">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>LevaAí • Fretes e mudanças</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Google Identity Services entrega apenas um token temporário ao Flutter.
       A validação e a criação da sessão acontecem no Cloudflare Worker. -->
  <script src="https://accounts.google.com/gsi/client" async></script>
  <script>
    window.levaAiGoogleSignIn = function (clientId) {
      return new Promise(function (resolve, reject) {
        const start = function () {
          if (!window.google || !google.accounts || !google.accounts.id) {
            reject(new Error('O login Google ainda está carregando.'));
            return;
          }

          // O One Tap automático pode ser bloqueado por navegadores com
          // proteção contra rastreamento. Exibimos o botão oficial do Google
          // em uma janela própria para o usuário sempre ter uma ação visível.
          const backdrop = document.createElement('div');
          backdrop.style.cssText = [
            'position:fixed', 'inset:0', 'z-index:2147483647',
            'display:flex', 'align-items:center', 'justify-content:center',
            'background:rgba(15,23,42,.52)', 'padding:24px'
          ].join(';');
          const dialog = document.createElement('div');
          dialog.style.cssText = [
            'width:min(360px,100%)', 'box-sizing:border-box',
            'border-radius:18px', 'background:#fff', 'padding:28px',
            'box-shadow:0 24px 64px rgba(15,23,42,.28)',
            'font-family:Arial,sans-serif', 'text-align:center', 'color:#1f2937'
          ].join(';');
          dialog.innerHTML = '<button aria-label="Fechar" style="float:right;border:0;background:transparent;font-size:24px;line-height:20px;cursor:pointer;color:#64748b">×</button><h2 style="margin:8px 0 10px;font-size:21px">Entrar no LevaAí</h2><p style="margin:0 0 22px;color:#64748b;font-size:14px;line-height:20px">Escolha sua conta Google para continuar.</p>';
          const buttonHost = document.createElement('div');
          buttonHost.style.cssText = 'display:flex;justify-content:center;min-height:44px';
          dialog.appendChild(buttonHost);
          backdrop.appendChild(dialog);
          document.body.appendChild(backdrop);

          const close = function (message) {
            backdrop.remove();
            reject(new Error(message));
          };
          dialog.querySelector('button').onclick = function () {
            close('Login Google cancelado.');
          };
          backdrop.onclick = function (event) {
            if (event.target === backdrop) close('Login Google cancelado.');
          };
          google.accounts.id.initialize({
            client_id: clientId,
            callback: function (response) {
              backdrop.remove();
              resolve(response.credential);
            },
            auto_select: false,
            cancel_on_tap_outside: false
          });
          google.accounts.id.renderButton(buttonHost, {
            theme: 'outline', size: 'large', type: 'standard',
            text: 'continue_with', shape: 'rectangular', width: 304
          });
        };
        if (window.google && google.accounts && google.accounts.id) start();
        else setTimeout(start, 500);
      });
    };
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
