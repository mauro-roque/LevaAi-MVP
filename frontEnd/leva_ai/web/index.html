<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Plataforma para intermediação e contratação de fretes e mudanças. Conecta motoristas e usuários através de busca inteligente por capacidade de carga, tipo de veículo e localização. (Projeto de TCC)">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="LevaAí">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>LevaAí • Fretes e mudanças</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Google Identity Services entrega apenas um token temporário ao Flutter.
       A validação e a criação da sessão acontecem no Cloudflare Worker. -->
  <script src="https://accounts.google.com/gsi/client" async></script>
  <script>
    window.levaAiGoogleSignIn = function (clientId) {
      return new Promise(function (resolve, reject) {
        const start = function () {
          if (!window.google || !google.accounts || !google.accounts.id) {
            reject(new Error('O login Google ainda está carregando.'));
            return;
          }
          google.accounts.id.initialize({
            client_id: clientId,
            callback: function (response) { resolve(response.credential); },
            auto_select: false,
            cancel_on_tap_outside: true
          });
          google.accounts.id.prompt(function (notification) {
            if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
              reject(new Error('Não foi possível abrir o seletor de conta Google.'));
            }
          });
        };
        if (window.google && google.accounts && google.accounts.id) start();
        else setTimeout(start, 500);
      });
    };
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
