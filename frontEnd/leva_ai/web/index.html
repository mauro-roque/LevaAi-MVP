<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Plataforma para intermediação e contratação de fretes e mudanças. Conecta motoristas e usuários através de busca inteligente por capacidade de carga, tipo de veículo e localização. (Projeto de TCC)">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="LevaAí">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>LevaAí • Fretes e mudanças</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Google Identity Services entrega apenas um token temporário ao Flutter.
       A validação e a criação da sessão acontecem no Cloudflare Worker. -->
  <script src="https://accounts.google.com/gsi/client" async></script>
  <script>
    window.levaAiRenderGoogleButton = function (elementId, clientId) {
      const render = function (attempt) {
        const host = document.getElementById(elementId);
        // Na primeira abertura da tela, o Flutter pode criar o host alguns
        // instantes depois desta chamada. Aguarda host e biblioteca do Google
        // para que o botão apareça sem precisar voltar à tela anterior.
        if (!host || !window.google || !google.accounts || !google.accounts.id) {
          if (attempt < 40) setTimeout(function () { render(attempt + 1); }, 250);
          return;
        }
        // Mantém a área reservada invisível enquanto o iframe oficial é criado.
        // Isso evita o efeito de piscada tanto no celular quanto no desktop.
        host.style.visibility = 'hidden';
        host.style.opacity = '0';
        host.style.transition = 'opacity 180ms ease-out';
        google.accounts.id.initialize({
          client_id: clientId,
          callback: function (response) {
            window.dispatchEvent(new CustomEvent('levaai-google-credential', {
              detail: response.credential
            }));
          },
          auto_select: false,
          cancel_on_tap_outside: true
        });
        host.replaceChildren();
        // A largura vem do contêiner do Flutter: no desktop chega a 400 px e,
        // no celular, acompanha exatamente o espaço disponível na tela.
        const width = Math.min(400, Math.floor(host.getBoundingClientRect().width));
        if (width < 1) {
          if (attempt < 40) setTimeout(function () { render(attempt + 1); }, 50);
          return;
        }
        google.accounts.id.renderButton(host, { size: 'large', width: width });
        const revealWhenReady = function (remaining) {
          const frame = host.querySelector('iframe');
          if (!frame && remaining > 0) {
            requestAnimationFrame(function () { revealWhenReady(remaining - 1); });
            return;
          }
          let revealed = false;
          const reveal = function () {
            if (revealed) return;
            revealed = true;
            // Aguarda o conteúdo interno do Google, incluindo a fonte oficial,
            // antes de tornar o botão visível. Assim não há troca de peso/fonte.
            setTimeout(function () {
              host.style.visibility = 'visible';
              requestAnimationFrame(function () { host.style.opacity = '1'; });
            }, 120);
          };
          if (frame) frame.addEventListener('load', reveal, { once: true });
          // Fallback se o navegador informar o carregamento antes do listener.
          setTimeout(reveal, 650);
        };
        revealWhenReady(20);
      };
      render(0);
    };
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
