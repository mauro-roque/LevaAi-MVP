services:
  - type: web
    name: leva-ai-mvp
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: MAPS_USER_AGENT
        value: "LevaAi-AcademicMVP/0.1"
